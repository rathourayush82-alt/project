<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Campus Note Share</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar with tabs, a compact hero with live stats, then a filter card, a card grid and a contributors rail.
   Look: lab-notebook teal with a highlighter yellow used only for emphasis; note pages draw like real paper (ruled, slide, exam, cheat sheet). */
:root{
 --bg:#eef3f1;--surf:#ffffff;--surf2:#f4f8f6;--ink:#0e1d19;--mute:#52655f;--line:#d3dfda;
 --brand:#0d7a68;--brand-d:#095c4e;--on-brand:#ffffff;--mark:#ffe44d;--on-mark:#2a2400;
 --paper:#fbfdfc;--rule:#c8dcef;--margin:#f0a8a2;--hand:#1c3d8f;
 --hw-bg:#fde7d6;--hw-fg:#8f3a08;--ty-bg:#dce9fd;--ty-fg:#1a46b8;--sl-bg:#e8e3fb;--sl-fg:#4c2aa8;--pq-bg:#fde0e0;--pq-fg:#a5191f;--ch-bg:#d9f3e2;--ch-fg:#14663a;
 --star:#d99a00;--danger:#c93a2e;--shadow:0 1px 2px rgba(14,29,25,.06),0 8px 22px rgba(14,29,25,.07);
 --fd:"Space Grotesk",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace;--fh:"Caveat","Bradley Hand",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --bg:#0b1512;--surf:#12201c;--surf2:#0f1b17;--ink:#e6f1ed;--mute:#9bb2aa;--line:#24372f;
 --brand:#3fcfb4;--brand-d:#7be3cf;--on-brand:#04201a;
 --paper:#16251f;--rule:#27404f;--margin:#6e3b3a;--hand:#a9c6ff;
 --hw-bg:#3b2414;--hw-fg:#ffb784;--ty-bg:#16284a;--ty-fg:#9ec1ff;--sl-bg:#2a2250;--sl-fg:#c6b8ff;--pq-bg:#431c1f;--pq-fg:#ffa3a6;--ch-bg:#14382a;--ch-fg:#8fe0b0;
 --star:#ffc933;--danger:#ff8b80;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
 --bg:#0b1512;--surf:#12201c;--surf2:#0f1b17;--ink:#e6f1ed;--mute:#9bb2aa;--line:#24372f;
 --brand:#3fcfb4;--brand-d:#7be3cf;--on-brand:#04201a;
 --paper:#16251f;--rule:#27404f;--margin:#6e3b3a;--hand:#a9c6ff;
 --hw-bg:#3b2414;--hw-fg:#ffb784;--ty-bg:#16284a;--ty-fg:#9ec1ff;--sl-bg:#2a2250;--sl-fg:#c6b8ff;--pq-bg:#431c1f;--pq-fg:#ffa3a6;--ch-bg:#14382a;--ch-fg:#8fe0b0;
 --star:#ffc933;--danger:#ff8b80;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:10}
h1,h2,h3,h4{font-family:var(--fd);margin:0;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{flex:none;vertical-align:-3px}.ic.sf{fill:currentColor}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surf);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px var(--fd);margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.search{flex:1 1 280px;order:3;display:flex;align-items:center;gap:8px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.search input{flex:1;min-width:0;border:0;background:none;padding:10px 0;outline:none}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
.tabs a{display:inline-flex;gap:8px;align-items:center;padding:10px 12px;text-decoration:none;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);border-color:var(--brand)}
.tabs small{background:var(--surf2);border:1px solid var(--line);border-radius:99px;padding:0 7px;font:500 12px var(--fm)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surf);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:var(--on-brand)}
.btn.ghost{background:none}.btn.sm{padding:6px 10px;font-size:13px}.btn.icon{padding:9px}.btn.sm.icon{padding:6px 8px}
.btn.on{background:color-mix(in srgb,var(--brand) 16%,var(--surf));border-color:var(--brand);color:var(--brand-d)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--brand-d);font-weight:600;text-decoration:underline;cursor:pointer}
:where(a,button,input,select,textarea):focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:end;padding-block:26px 18px}
.hero h1{font-size:clamp(28px,4.6vw,44px);line-height:1.05;font-weight:700}
.hero h1 mark{background:var(--mark);color:var(--on-mark);padding:0 .15em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{margin:10px 0 0;color:var(--mute);max-width:52ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font:700 22px var(--fd);font-variant-numeric:tabular-nums}.kpi small{color:var(--mute);font-size:12px}

/* filters */
.filters{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;margin-bottom:14px}
.frow{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.flab{font:600 12px var(--fm);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;min-width:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fc{border:1px solid var(--line);background:var(--surf2);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:500;cursor:pointer}
.fc[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fsel{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
select,input[type=text],input[type=search],textarea,.fi{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.fsel select{width:auto}
select:focus,textarea:focus,input:focus{border-color:var(--brand)}

/* layout */
.lib{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start;padding-bottom:60px}
.rh{display:flex;gap:12px;align-items:center;margin:0 0 10px;color:var(--mute)}.rh strong{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:hover{box-shadow:var(--shadow)}
.thumb{display:block;position:relative;aspect-ratio:10/7;background:var(--surf2);border-bottom:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.thumb .chip{position:absolute;left:10px;top:10px}.own{position:absolute;right:10px;top:10px;background:var(--mark);color:var(--on-mark);font:700 11px var(--fm);padding:2px 7px;border-radius:5px}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.cb h3{font-size:16px;line-height:1.25}.cb h3 a{text-decoration:none}.cb h3 a:hover{text-decoration:underline}
.code{font:500 12px var(--fm);color:var(--mute);display:flex;gap:8px;flex-wrap:wrap}.code b{color:var(--ink);font-weight:500}
.by{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px;margin:0}
.av{width:22px;height:22px;border-radius:50%;background:hsl(var(--h) 45% 38%);color:#fff;font:700 10px var(--fd);display:inline-grid;place-items:center;flex:none}
.st{display:flex;gap:12px;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}.st span{display:inline-flex;gap:4px;align-items:center}.st .ic.sf{color:var(--star)}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:6px}.acts .btn:first-child{flex:1}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px}
.t-hand{background:var(--hw-bg);color:var(--hw-fg)}.t-typed{background:var(--ty-bg);color:var(--ty-fg)}.t-slides{background:var(--sl-bg);color:var(--sl-fg)}.t-pyq{background:var(--pq-bg);color:var(--pq-fg)}.t-cheat{background:var(--ch-bg);color:var(--ch-fg)}
mark{background:var(--mark);color:var(--on-mark);border-radius:3px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:10px}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}.lb li{display:flex;align-items:center;gap:10px}.lb .av{width:30px;height:30px;font-size:12px}.lb div{min-width:0;flex:1}.lb b{display:block;font-weight:600;font-size:14px}.lb small{color:var(--mute)}
.lb .n{font:700 13px var(--fm);color:var(--mute)}
.tip{font-size:13px;color:var(--mute)}.tip b{color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:36px 14px;background:var(--surf);border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px;justify-items:center}

/* requests */
.reqs{display:grid;gap:10px;padding-bottom:60px;max-width:820px}
.rf{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:10px;align-items:end;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:6px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.rq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px}
.rq p{margin:0}.rq .acts{margin:0;padding:0;grid-column:2;grid-row:1/3;align-self:center;flex-direction:column}
.done{display:inline-flex;gap:5px;align-items:center;color:var(--ch-fg);font-weight:600;font-size:13px}
.sec{margin:22px 0 10px;font-size:18px}.sec:first-child{margin-top:8px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--bg);color:var(--ink);width:min(1000px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(4,12,10,.6)}
.dh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px;background:var(--surf);border-bottom:1px solid var(--line)}
.dh h2{font-size:clamp(20px,3vw,26px);margin-top:6px}
.db{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;padding:18px;overflow:auto}
.pgs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pgnav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--mute);font:500 13px var(--fm)}
.info{display:grid;gap:14px;align-content:start;min-width:0}
.info p{margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font:500 12px var(--fm);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--mute)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kv div{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.kv b{display:block;font:700 18px var(--fd)}.kv small{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;padding:3px;cursor:pointer;color:var(--line)}.stars button.on{color:var(--star)}.stars .ic{fill:currentColor;stroke:currentColor}
.cm h4{font-size:15px;margin-bottom:8px}.cl{display:grid;gap:10px;margin:0 0 10px;padding:0;list-style:none}.cl li{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}.cl small{color:var(--mute);display:block}
.cm textarea{min-height:64px;resize:vertical}
.uf{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px;overflow:auto}.uf .full{grid-column:1/-1}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);background:var(--surf2);cursor:pointer;display:grid;gap:6px;justify-items:center}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surf2))}
.err{color:var(--danger);font-weight:600;font-size:13px;margin:0;min-height:1.2em}
.fchip{display:flex;gap:8px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}.fchip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{display:flex;gap:8px;justify-content:flex-end}

/* note pages */
.sheet{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-height:340px}
.sheet h4{font-size:18px;line-height:1.3;margin:0 0 12px}
.sheet ul,.sheet ol{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.sheet code{font:500 .86em var(--fm);background:var(--surf2);border:1px solid var(--line);padding:0 5px;border-radius:4px;word-break:break-word}
.typed li{position:relative;padding-left:16px}.typed li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:2px;background:var(--brand)}
.hand{padding:0 16px 0 58px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);font:500 24px/32px var(--fh);color:var(--hand)}
.hand::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin)}
.hand h4{font:600 30px/32px var(--fh);margin:0;color:var(--hand)}.hand ul{gap:0}.hand li{line-height:32px}
.hand code{font:500 14px var(--fm);color:var(--ink);background:none;border:0;border-bottom:1px dashed var(--hand);border-radius:0}
.slide{background:var(--brand);color:var(--on-brand);border:0;padding:30px 34px;display:flex;flex-direction:column;justify-content:center}
.slide h4{font-size:26px;margin-bottom:16px}.slide li{position:relative;padding-left:20px;font-size:16px}.slide li::before{content:"";position:absolute;left:0;top:.5em;width:9px;height:9px;border-radius:50%;background:var(--mark)}
.slide code{background:rgba(255,255,255,.22);border:0;color:inherit}
.cheat ul{grid-template-columns:repeat(2,minmax(0,1fr))}.cheat li{border:1px solid var(--line);border-radius:8px;background:var(--surf2);padding:10px 12px;font-size:14px}
.q li{display:flex;justify-content:space-between;gap:14px;border-bottom:1px dashed var(--line);padding-bottom:9px}
.mk{flex:none;font:600 12px var(--fm);border:1px solid var(--line);border-radius:6px;padding:2px 7px;height:max-content}
.sheet.img{padding:0;overflow:hidden}.sheet.img img{display:block;width:100%}
.sheet.fl{display:grid;place-items:center;text-align:center;color:var(--mute);gap:6px;align-content:center}.sheet.fl b{color:var(--ink)}
.p-paper{fill:var(--paper)}.p-rule{stroke:var(--rule);fill:none}.p-margin{stroke:var(--margin);fill:none}.p-hand{stroke:var(--hand);fill:none;stroke-linecap:round;stroke-linejoin:round}
.p-ink{fill:var(--ink)}.p-mute{fill:var(--mute)}.p-surf{fill:var(--surf2)}.p-line{stroke:var(--line);fill:var(--surf2)}.p-brand{fill:var(--brand)}.p-on{fill:var(--on-brand)}.p-mark{fill:var(--mark)}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;justify-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}

@media (max-width:900px){.lib{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}.db{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.rf{grid-template-columns:minmax(0,1fr)}.uf{grid-template-columns:minmax(0,1fr)}.rq{grid-template-columns:minmax(0,1fr)}.rq .acts{grid-column:1;grid-row:auto;flex-direction:row}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cheat ul{grid-template-columns:minmax(0,1fr)}.hand{font-size:21px}.fsel{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
</style>

 <div class="wrap bar">

<script>
"use strict";
var KEY="cns.v1",TABS=["library","requests","shelf"];

 bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',

 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

function pageHTML(n,p){
 if(p.img)return'<div class="sheet img"><img src="'+p.img+'" alt="Uploaded page of '+esc(n.title)+'"></div>';
 if(p.file)return'<div class="sheet fl">'+ic("file",40)+"<b>"+esc(p.file.name)+"</b><span>"+size(p.file.size)+'</span><span>This file stays on your device. Only the details are shared in the demo.</span></div>';
 if(n.type==="pyq")return'<div class="sheet q"><h4>'+esc(p.h)+'</h4><ol>'+p.l.map(function(x){var m=/\s*\[(\d+)\]\s*$/.exec(x);return"<li><span>"+fmt(m?x.slice(0,m.index):x)+"</span>"+(m?'<b class="mk">'+m[1]+" marks</b>":"")+"</li>"}).join("")+"</ol></div>";
 return'<div class="sheet '+(n.type==="hand"?"hand":n.type==="slides"?"slide":n.type==="cheat"?"cheat":"typed")+'"><h4>'+esc(p.h)+"</h4><ul>"+p.l.map(function(x){return"<li>"+fmt(x)+"</li>"}).join("")+"</ul></div>"}

function renderNote(){var n=byId(curId);if(!n)return;var d=$("#dlg"),old=$("#cm-txt"),keep=old?old.value:"",sv=S.me.saved.indexOf(n.id)>=0,vt=S.me.voted.indexOf(n.id)>=0,my=S.me.rated[n.id]||0,a=avg(n);
 curPg=Math.max(0,Math.min(curPg,n.pages.length-1));
 d.innerHTML='<div class="dh"><div><span class="chip t-'+n.type+'">'+TYPES[n.type]+'</span> <span class="code" style="display:inline-flex"><b>'+esc(n.code)+"</b><span>Semester "+n.sem+" · "+esc(n.dept)+"</span></span><h2>"+esc(n.title)+'</h2></div><button class="btn ghost icon" data-act="close" aria-label="Close">'+ic("x",18)+'</button></div><div class="db"><div><div class="pgs" role="tablist">'+n.pages.map(function(p,i){return'<button class="fc" role="tab" data-act="pg" data-i="'+i+'" aria-pressed="'+(i===curPg)+'" aria-selected="'+(i===curPg)+'">Page '+(i+1)+"</button>"}).join("")+"</div>"+pageHTML(n,n.pages[curPg])+'<div class="pgnav"><button class="btn sm" data-act="pgd" data-d="-1"'+(curPg===0?" disabled":"")+">"+ic("left",14)+' Previous</button><span>Page '+(curPg+1)+" of "+n.pages.length+'</span><button class="btn sm" data-act="pgd" data-d="1"'+(curPg===n.pages.length-1?" disabled":"")+">Next "+ic("right",14)+'</button></div></div><aside class="info"><p class="by">'+av(n.by)+"Shared by <b>"+esc(n.by)+"</b> · "+age(n.days)+"</p><p>"+esc(n.desc||"No description added.")+'</p><div class="tags">'+n.tags.map(function(t){return"<span>#"+esc(t)+"</span>"}).join("")+'</div><div class="kv"><div><b>'+(a?a.toFixed(1):"New")+"</b><small>"+n.rn+' ratings</small></div><div><b>'+n.helpful+"</b><small>found helpful</small></div><div><b>"+n.saves+"</b><small>saved</small></div><div><b>"+n.views+"</b><small>views</small></div></div>"+
  '<div class="row"><button class="btn'+(vt?" on":"")+'" data-act="vote" data-id="'+n.id+'" aria-pressed="'+vt+'">'+ic("up",16)+' Helpful</button><button class="btn'+(sv?" on":"")+'" data-act="save" data-id="'+n.id+'" aria-pressed="'+sv+'">'+ic("bookmark",16)+(sv?" Saved":" Save")+'</button><button class="btn" data-act="copy">'+ic("link",16)+' Copy link</button></div><div><label>Your rating</label><div class="stars" role="group" aria-label="Rate this note">'+[1,2,3,4,5].map(function(i){return'<button data-act="rate" data-v="'+i+'" class="'+(i<=my?"on":"")+'" aria-label="'+i+(i===1?" star":" stars")+'" aria-pressed="'+(i<=my)+'">'+ic("star",24)+"</button>"}).join("")+'</div></div><section class="cm"><h4>Comments ('+n.comments.length+')</h4><ul class="cl">'+(n.comments.length?n.comments.map(function(c){return"<li><small>"+esc(c.by)+" · "+age(c.days)+"</small>"+esc(c.txt)+"</li>"}).join(""):'<li><small>No comments yet</small>Ask a question or say what helped.</li>')+'</ul><label class="sr" for="cm-txt">Add a comment</label><textarea id="cm-txt" maxlength="300" placeholder="Add a comment"></textarea><p style="margin-top:8px"><button class="btn sm primary" data-act="comment">Post comment</button></p></section></aside></div>';
 var t=$("#cm-txt");if(t&&keep)t.value=keep}

function openNote(id){var n=byId(id);if(!n){location.hash=F.tab;return}var d=$("#dlg");if(curId!==n.id||!d.open){curId=n.id;curPg=0;n.views++;persist()}renderNote();if(!d.open)d.showModal();renderMain()}

/* ---------- upload dialog ---------- */
function upHTML(){return'<div class="dh"><div><h2>Upload notes</h2><p style="margin:4px 0 0;color:var(--mute);font-size:14px">Add a title, the course code and your notes. Typed text, a photo or a file all work.</p></div><button class="btn ghost icon" data-act="upclose" aria-label="Close">'+ic("x",18)+'</button></div><form class="uf" id="uf" novalidate><div class="full"><label for="nt-title">Title</label><input id="nt-title" type="text" maxlength="70" placeholder="Computer Networks: Subnetting Practice" required></div><div><label for="nt-code">Course code</label><input id="nt-code" type="text" maxlength="10" placeholder="CSE310" required></div><div><label for="nt-dept">Department</label><select id="nt-dept">'+DEPTS.map(function(d){return"<option>"+d+"</option>"}).join("")+'</select></div><div><label for="nt-sem">Semester</label><select id="nt-sem">'+[1,2,3,4,5,6,7,8].map(function(s){return"<option>"+s+"</option>"}).join("")+'</select></div><div><label for="nt-type">Type</label><select id="nt-type">'+Object.keys(TYPES).map(function(k){return'<option value="'+k+'">'+TYPES[k]+"</option>"}).join("")+'</select></div><div class="full"><label for="nt-desc">Short description</label><input id="nt-desc" type="text" maxlength="140" placeholder="What is covered and who it helps"></div><div class="full"><label for="nt-tags">Tags, separated by commas</label><input id="nt-tags" type="text" maxlength="60" placeholder="subnetting, ip, cidr"></div><div class="full"><label for="nt-text">Type your notes (blank line starts a new page)</label><textarea id="nt-text" rows="6" placeholder="Subnet mask\nA /26 mask leaves 6 host bits, so 62 usable hosts\n\nCIDR\nWrite the prefix length after the address"></textarea></div><div class="full"><label for="nt-file">Or attach a photo or file</label><div class="drop" id="drop"><span>'+ic("upload",22)+'</span><span>Drop a file here or <button type="button" class="link" id="pick">choose one</button></span><input id="nt-file" type="file" accept="image/*,.pdf,.txt,.md,.doc,.docx,.ppt,.pptx" class="sr"></div><div id="fshow" style="margin-top:8px"></div></div><p class="err full" id="uerr" role="alert"></p><div class="full foot"><button type="button" class="btn" data-act="upclose">Cancel</button><button class="btn primary" type="submit">Publish notes</button></div></form>'}
function openUp(pre){pre=pre||{};upFile=null;upReq=pre.req||0;var d=$("#up");d.innerHTML=upHTML();if(pre.code)$("#nt-code").value=pre.code;if(pre.title)$("#nt-title").value=pre.title;showFile();if(!d.open)d.showModal()}
function showFile(){var el=$("#fshow");if(!el)return;el.innerHTML=upFile?'<div class="fchip">'+ic("file",16)+"<span>"+esc(upFile.name)+"</span>"+'<button type="button" class="btn sm ghost" data-act="rmfile">Remove</button></div>':""}
function takeFile(f){if(!f)return;
 if(/^image\//.test(f.type)){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);upFile={kind:"img",name:f.name,data:c.toDataURL("image/jpeg",.75)};showFile()};im.src=r.result};r.readAsDataURL(f)}
 else if(/^text\//.test(f.type)||/\.(txt|md)$/i.test(f.name)){var t=new FileReader();t.onload=function(){upFile={kind:"text",name:f.name,text:String(t.result).slice(0,12000)};var box=$("#nt-text");if(box&&!box.value.trim())box.value=upFile.text;showFile()};t.readAsText(f)}
 else{upFile={kind:"file",name:f.name,size:f.size};showFile()}}
function publish(){var g=function(i){return $("#"+i).value.trim()},err=$("#uerr"),title=g("nt-title"),code=g("nt-code").toUpperCase(),txt=g("nt-text");
 if(!title||!code){err.textContent="Add a title and a course code.";return}
 if(!txt&&!upFile){err.textContent="Type some notes or attach a file so there is something to read.";return}
 var pages=[];
 if(upFile&&upFile.kind==="img")pages.push({h:"Page 1",l:[],img:upFile.data});
 if(txt)txt.split(/\n\s*\n/).forEach(function(b,i){var ls=b.split("\n").map(function(s){return s.trim()}).filter(Boolean);if(!ls.length)return;var hd=ls.length>1&&ls[0].length<=48?ls.shift():"Page "+(pages.length+1);pages.push({h:hd,l:ls})});
 if(upFile&&upFile.kind==="file")pages.push({h:"Attachment",l:[],file:{name:upFile.name,size:upFile.size}});
 var n={id:Date.now(),code:code,title:title,dept:g("nt-dept"),sem:+g("nt-sem"),type:g("nt-type"),by:"You",days:0,mine:true,tags:g("nt-tags").split(",").map(function(t){return t.trim().toLowerCase()}).filter(Boolean).slice(0,5),desc:g("nt-desc"),pages:pages,rs:0,rn:0,helpful:0,saves:0,views:0,comments:[]};
 S.notes.unshift(n);if(upReq){var rq=S.reqs.filter(function(r){return r.id===upReq})[0];if(rq)rq.done=n.id}
 persist();$("#up").close();F={q:"",dept:"all",type:"all",sem:"all",sort:"new",tab:"library"};$("#q").value="";toast("Notes published. Thank you for sharing.");if(location.hash==="#library")renderMain();else location.hash="library"}

/* ---------- actions ---------- */
function toggle(arr,v){var i=arr.indexOf(v);if(i>=0){arr.splice(i,1);return false}arr.push(v);return true}
function refresh(){persist();renderMain();if($("#dlg").open)renderNote()}
document.addEventListener("click",function(e){
 var f=e.target.closest("[data-f]");if(f){F[f.dataset.f]=f.dataset.v;renderMain();return}
 var b=e.target.closest("[data-act]");if(!b){if(e.target===$("#dlg")||e.target===$("#up"))e.target.close();return}
 var a=b.dataset.act,id=+b.dataset.id,n=id?byId(id):null;
 if(a==="theme"){var r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark"}
 else if(a==="upload")openUp();
 else if(a==="upclose")$("#up").close();
 else if(a==="close")$("#dlg").close();
 else if(a==="clear"){F.q="";F.dept="all";F.type="all";F.sem="all";$("#q").value="";renderMain()}
 else if(a==="ask"){var q=F.q;location.hash="requests";setTimeout(function(){var t=$("#rq-text");if(t&&q)t.value=q;if(t)t.focus()},30)}
 else if(a==="vote"&&n){n.helpful+=toggle(S.me.voted,n.id)?1:-1;refresh()}
 else if(a==="save"&&n){var on=toggle(S.me.saved,n.id);n.saves+=on?1:-1;toast(on?"Saved to your shelf":"Removed from your shelf");refresh()}
 else if(a==="pg"){curPg=+b.dataset.i;renderNote()}
 else if(a==="pgd"){curPg+=+b.dataset.d;renderNote()}
 else if(a==="rate"){var m=byId(curId),v=+b.dataset.v,pv=S.me.rated[m.id]||0;if(pv){m.rs-=pv;m.rn--}if(pv===v)delete S.me.rated[m.id];else{S.me.rated[m.id]=v;m.rs+=v;m.rn++}refresh()}
 else if(a==="comment"){var t=$("#cm-txt"),v2=t.value.trim();if(!v2)return;byId(curId).comments.push({by:"You",txt:v2,days:0});t.value="";refresh();toast("Comment posted")}
 else if(a==="copy"){var u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast("Link copied")},function(){toast("Copy the address from your browser bar")})}
 else if(a==="need"){var rq=S.reqs.filter(function(r){return r.id===id})[0];toggle(S.me.needed,rq.id);refresh()}
 else if(a==="fulfil"){var q2=S.reqs.filter(function(r){return r.id===id})[0];openUp({code:q2.code,title:q2.text,req:q2.id})}
 else if(a==="rmfile"){upFile=null;showFile()}});
document.addEventListener("input",function(e){if(e.target.id==="q"){F.q=e.target.value.trim();if(F.tab!=="library")location.hash="library";else renderMain()}});
document.addEventListener("change",function(e){var s=e.target.dataset&&e.target.dataset.s;if(s){F[s]=e.target.value;renderMain()}if(e.target.id==="nt-file")takeFile(e.target.files[0])});
document.addEventListener("submit",function(e){e.preventDefault();
 if(e.target.id==="uf")publish();
 else if(e.target.id==="rqf"){var c=$("#rq-code").value.trim().toUpperCase(),t=$("#rq-text").value.trim();if(!c||!t)return;S.reqs.push({id:Date.now(),code:c,text:t,by:"You",days:0,need:1});toggle(S.me.needed,S.reqs[S.reqs.length-1].id);persist();renderMain();toast("Request posted")}});
document.addEventListener("click",function(e){if(e.target.id==="pick")$("#nt-file").click()});
["dragover","dragleave","drop"].forEach(function(t){document.addEventListener(t,function(e){var z=e.target.closest&&e.target.closest("#drop");if(!z)return;e.preventDefault();z.classList.toggle("over",t==="dragover");if(t==="drop")takeFile(e.dataTransfer.files[0])})});
$("#dlg").addEventListener("close",function(){if(/^#note-/.test(location.hash))location.hash=F.tab;curId=0});

/* ---------- router ---------- */
function route(){var h=location.hash.slice(1);
 if(/^note-\d+$/.test(h)){if(TABS.indexOf(F.tab)<0)F.tab="library";openNote(+h.slice(5));return}
 if(TABS.indexOf(h)>=0)F.tab=h;if($("#dlg").open)$("#dlg").close();renderMain();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
$("#sic").innerHTML=ic("search",18);$("#upbtn").innerHTML=ic("plus",16)+" Upload notes";$("button[data-act=theme]").innerHTML=ic("contrast",18);
route();
</script>

</body></html>
